[package]
name = "pmetal-gguf"
description = "Read, write, quantize and dequantize GGUF files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://epistates.github.io/pmetal/pmetal_gguf/"
homepage.workspace = true
readme = "README.md"
keywords = ["gguf", "ggml", "quantization", "llm", "file-format"]
categories = ["encoding", "science"]

[dependencies]
pmetal-core = { workspace = true }
byteorder = { workspace = true }
half = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
