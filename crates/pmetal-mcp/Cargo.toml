[package]
name = "pmetal-mcp"
description = "MCP server exposing PMetal ML toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "pmetal-mcp"
path = "src/main.rs"

[dependencies]
# Internal crates — lightweight, library-callable operations
pmetal-core = { workspace = true }
pmetal-metal = { workspace = true }
pmetal-hub = { workspace = true }
pmetal-supervisor = { workspace = true, features = ["schemars"] }

# MCP server framework
turbomcp = { workspace = true, features = ["stdio"] }
turbomcp-types = { workspace = true }

# Input and output schemas, generated from the types the tools use
schemars = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client (for chat tool → serve interaction)
reqwest = { workspace = true }

# Staging directory names
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# The cancellation token a transport hands a request, to cancel one in a test
tokio-util = { workspace = true }

[lints]
workspace = true
