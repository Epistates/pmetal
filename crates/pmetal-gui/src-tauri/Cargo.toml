[package]
name = "pmetal-gui"
version = "0.6.0"
description = "PMetal - Apple Silicon ML Training Suite"
edition = "2024"
license = "MIT OR Apache-2.0"
# Ships as the PMetal.app bundle, never to crates.io.
publish = false

[lib]
name = "pmetal_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# This crate is its own workspace, so it can't inherit from the root's
# [workspace.dependencies]. Requirements shared with the root are kept equal
# to the root's, so both lockfiles resolve the same versions.

# Tauri
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.53", features = ["full"] }
futures = "0.3.34"

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# IDs
uuid = { version = "1.26", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
dirs = "7"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
pmetal = { path = "../../pmetal", features = ["full"] }
pmetal-bridge = { path = "../../pmetal-bridge" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# tauri-plugin-updater = "2"  # TODO: re-enable once signing key is configured in CI
tauri-plugin-process = "2.4"

# Optimize all dependencies in dev builds — training/tokenization is CPU-bound
# and ~10x slower without optimizations. The GUI's own code stays at opt-level 1
# for fast recompilation.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
