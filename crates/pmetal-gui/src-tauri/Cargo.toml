[package]
name = "pmetal-gui"
version = "0.6.0"
description = "PMetal - Apple Silicon ML Training Suite"
edition = "2024"
license = "MIT OR Apache-2.0"
# Ships as the PMetal.app bundle, never to crates.io.
publish = false

# Its own workspace root. The root manifest's `exclude` keeps it out of that
# workspace, but cargo only honours an `exclude` from the first workspace it
# finds walking up, so a checkout nested inside another cargo workspace failed
# with "believes it's in a workspace when it's not". Declaring the root here
# ends the search.
[workspace]

[lib]
name = "pmetal_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# This crate is its own workspace, so it can't inherit from the root's
# [workspace.dependencies]. Requirements shared with the root are kept equal
# to the root's, so both lockfiles resolve the same versions.

# Tauri
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.53", features = ["full"] }

# Time
chrono = { version = "0.4.45", features = ["serde"] }

# IDs
uuid = { version = "1.27", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
dirs = "7"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
pmetal = { path = "../../pmetal", features = ["full"] }
pmetal-runtime = { path = "../../pmetal-runtime" }
pmetal-supervisor = { path = "../../pmetal-supervisor" }

# The Hugging Face token lives in the system keychain, never in a file.
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tempfile = "3"

# Optimize all dependencies in dev builds — training/tokenization is CPU-bound
# and ~10x slower without optimizations. The GUI's own code stays at opt-level 1
# for fast recompilation.
[profile.dev]
opt-level = 1
# Same as the root workspace's dev profile: profile settings are part of a
# crate's build hash, so any difference here rebuilds every shared dependency
# in target/ instead of reusing the root's.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# This crate is outside the root workspace, so it can't inherit
# [workspace.lints]; these mirror them.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
