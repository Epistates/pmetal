[package]
name = "pmetal"
description = "High-performance LLM fine-tuning framework for Apple Silicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "pmetal"
path = "src/main.rs"
required-features = ["cli"]

[features]
# `distributed` is on-by-default so a stock `pmetal` binary ships the
# `pmetal cluster` subcommand and the trainer's `--distributed-auto` flag.
# Library consumers who don't want libp2p in their dependency tree can
# opt out via `pmetal = { version = "x", default-features = false, features = [...] }`.
default = ["cli", "dashboard", "trainer", "lora", "merge", "vocoder", "ane", "distributed"]

# Foundation crates (no MLX dependency)
core = ["dep:pmetal-core"]
gguf = ["dep:pmetal-gguf", "core"]
metal = ["dep:pmetal-metal", "core"]
hub = ["dep:pmetal-hub", "core"]
distributed = ["dep:pmetal-distributed", "pmetal-trainer?/distributed"]
mhc = ["dep:pmetal-mhc"]

# Runtime-dependent crates
runtime = ["dep:pmetal-runtime", "core", "metal"]
cache = ["dep:pmetal-cache", "runtime"]
models = ["dep:pmetal-models", "core", "gguf", "metal", "runtime", "cache"]
# Native-only: inference through pmetal-runtime alone, without pmetal-cache or pmetal-models
native-only = ["runtime"]
lora = ["dep:pmetal-lora", "core", "gguf", "metal", "runtime", "cache", "models"]
data = ["dep:pmetal-data", "core", "runtime"]
trainer = ["dep:pmetal-trainer", "core", "runtime", "cache", "metal", "lora", "models", "data", "distill"]
distill = ["dep:pmetal-distill", "core", "runtime", "metal"]
merge = ["dep:pmetal-merge", "core", "runtime"]
vocoder = ["dep:pmetal-vocoder", "core", "runtime"]

# ANE: Apple Neural Engine direct programming
ane = ["metal", "pmetal-metal/ane", "pmetal-core/ane", "pmetal-trainer?/ane", "pmetal-models?/ane"]

# Everything (sub-crate deps only, no CLI-only deps)
full = [
    "core", "gguf", "metal", "hub", "distributed", "mhc",
    "runtime", "cache", "models", "lora", "data", "trainer",
    "distill", "merge", "vocoder", "ane",
]

# CLI: adds the pmetal binary + all CLI-specific dependencies
cli = [
    "core", "gguf", "metal", "hub", "runtime", "cache", "models", "data",
    "dep:clap", "dep:clap_complete", "dep:tokio", "dep:tracing-subscriber",
    "dep:serde", "dep:serde-saphyr", "dep:indicatif", "dep:anyhow",
    "dep:safetensors", "dep:dirs", "dep:chrono",
    "dep:rand", "dep:regex", "dep:tempfile", "dep:tokenizers",
    "dep:walkdir", "dep:flate2", "dep:libc", "dep:sha2",
]

# Dashboard: TUI (adds ratatui/crossterm on top of cli)
dashboard = ["cli", "dep:ratatui", "dep:crossterm", "dep:futures", "dep:tokio-util", "dep:pmetal-supervisor"]

# Serve: HTTP inference server
serve = ["cli", "dep:pmetal-serve"]

# MCP: Model Context Protocol server for Claude Desktop
mcp = ["cli", "dep:pmetal-mcp"]

[dependencies]
# Sub-crates (all optional — activated by feature flags above)
pmetal-core = { workspace = true, optional = true }
pmetal-gguf = { workspace = true, optional = true }
pmetal-metal = { workspace = true, optional = true }
pmetal-hub = { workspace = true, optional = true }
pmetal-distributed = { workspace = true, optional = true }
pmetal-mhc = { workspace = true, optional = true }
pmetal-cache = { workspace = true, optional = true }
pmetal-models = { workspace = true, optional = true }
pmetal-runtime = { workspace = true, optional = true }
pmetal-lora = { workspace = true, optional = true }
pmetal-data = { workspace = true, optional = true }
pmetal-trainer = { workspace = true, optional = true }
pmetal-distill = { workspace = true, optional = true }
pmetal-merge = { workspace = true, optional = true }
pmetal-vocoder = { workspace = true, optional = true }
pmetal-serve = { workspace = true, optional = true }
pmetal-mcp = { workspace = true, optional = true }
pmetal-supervisor = { workspace = true, optional = true }

# Always-on (SDK facade needs these)
serde_json = { workspace = true }
tracing = { workspace = true }
half = { workspace = true }

# CLI dependencies (optional, behind "cli" feature)
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Dashboard dependencies (optional, behind "dashboard" feature)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, features = ["event-stream"], optional = true }
futures = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }

[build-dependencies]
flate2 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Parquet fixtures for the dataset commands
arrow = { workspace = true }
parquet = { workspace = true }
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
# Test scratch directories; the library carries it only behind `cli`.
tempfile = { workspace = true }

[[example]]
name = "device_info"
path = "examples/device_info.rs"

[[example]]
name = "inference"
path = "examples/inference.rs"
required-features = ["hub", "data", "models"]

[[example]]
name = "finetune_manual"
path = "examples/finetune_manual.rs"
required-features = ["data", "lora", "trainer"]

[[example]]
name = "finetune_ane"
path = "examples/finetune_ane.rs"
required-features = ["trainer", "ane"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
