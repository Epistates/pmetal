[package]
name = "pmetal-distill"
description = "Knowledge distillation for PMetal: divergence losses, hidden state alignment, TAID and offline logit caches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["distillation", "knowledge-distillation", "llm", "machine-learning", "apple-silicon"]
categories = ["science", "algorithms"]

[dependencies]
pmetal-runtime = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bitcode = { workspace = true }

[dev-dependencies]
# Fail every test at the runtime op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[[bench]]
name = "gpu_losses"
harness = false

[lints]
workspace = true
