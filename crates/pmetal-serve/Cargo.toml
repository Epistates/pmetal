[package]
name = "pmetal-serve"
description = "OpenAI- and Anthropic-compatible inference server for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://epistates.github.io/pmetal/pmetal_serve/"
homepage.workspace = true
readme = "README.md"
keywords = ["llm", "inference", "openai", "server", "apple-silicon"]
categories = ["web-programming::http-server", "science"]

[features]
default = []

[dependencies]
pmetal-models = { workspace = true }
pmetal-data = { workspace = true }
pmetal-cache = { workspace = true }
pmetal-runtime = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
llguidance = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
prometheus-client = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
criterion = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }

[[bench]]
name = "continuous_batch"
harness = false

# Inherit workspace lints, including `unsafe_code = "deny"`. The models live
# on their own threads (`pmetal_models::model_thread`), so nothing here has to
# claim a `!Send` model is safe to share.
[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
