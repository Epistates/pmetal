[package]
name = "pmetal-serve"
description = "OpenAI-compatible inference server for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []

[dependencies]
pmetal-core = { workspace = true }
pmetal-metal = { workspace = true }
pmetal-models = { workspace = true }
pmetal-data = { workspace = true }
pmetal-mlx = { workspace = true }
pmetal-bridge = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
futures = { workspace = true }
tokio-stream = "0.1"
base64 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "continuous_batch"
harness = false

# Inherit workspace lints, including `unsafe_code = "deny"`. The models live
# on their own threads (`pmetal_models::model_thread`), so nothing here has to
# claim a `!Send` model is safe to share.
[lints]
workspace = true
