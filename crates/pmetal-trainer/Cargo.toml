[package]
name = "pmetal-trainer"
description = "Training loops and optimization for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ane", "hub"]
# No-op: TensorBoard logging is always built. Kept so manifests naming it still resolve.
tensorboard = []
ane = ["pmetal-metal/ane", "pmetal-core/ane"]
hub = ["dep:pmetal-hub"]
distributed = ["dep:pmetal-distributed"]

[dependencies]
pmetal-core = { workspace = true }
pmetal-cache = { workspace = true }
pmetal-lora = { workspace = true }
pmetal-data = { workspace = true }
pmetal-models = { workspace = true }
pmetal-distill = { workspace = true }
pmetal-metal = { workspace = true }
# Writes a fully fine-tuned model next to the base model's side files (full-parameter training, ANE included).
pmetal-merge = { workspace = true }
safetensors = { workspace = true }
pmetal-distributed = { workspace = true, optional = true }
pmetal-hub = { workspace = true, optional = true }
pmetal-runtime = { workspace = true }
# Kills an external reward command's process group.
pmetal-supervisor = { workspace = true }
jsonschema = { workspace = true }
regex = { workspace = true }
shlex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
serde-saphyr = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }

# TensorBoard event files
prost = { workspace = true }
crc = { workspace = true }

[dev-dependencies]
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
