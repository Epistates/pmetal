[package]
name = "pmetal-trainer"
description = "Training loops and optimization for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["ane", "hub"]
# No-op: TensorBoard logging is always built. Kept so manifests naming it still resolve.
tensorboard = []
ane = ["pmetal-metal/ane", "pmetal-core/ane"]
hub = ["dep:pmetal-hub"]
distributed = ["dep:pmetal-distributed"]
experimental-trainers = []

[dependencies]
pmetal-core = { workspace = true }
pmetal-mlx = { workspace = true }
pmetal-lora = { workspace = true }
pmetal-data = { workspace = true }
pmetal-models = { workspace = true }
pmetal-distill = { workspace = true }
pmetal-metal = { workspace = true }
pmetal-distributed = { workspace = true, optional = true }
pmetal-hub = { workspace = true, optional = true }
pmetal-bridge = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
image = { workspace = true }

# TensorBoard event files
prost = "0.14"
crc = "3.4"

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
