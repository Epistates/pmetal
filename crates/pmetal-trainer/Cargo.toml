[package]
name = "pmetal-trainer"
description = "Training loops, trainers and optimizers for PMetal: SFT, LoRA, preference, GRPO, distillation, pretraining"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["ane", "hub"]
# No-op: TensorBoard logging is always built. Kept so manifests naming it still resolve.
tensorboard = []
ane = ["pmetal-metal/ane", "pmetal-core/ane", "dep:pmetal-merge", "dep:safetensors"]
hub = ["dep:pmetal-hub"]
distributed = ["dep:pmetal-distributed"]

[dependencies]
pmetal-core = { workspace = true }
pmetal-cache = { workspace = true }
pmetal-lora = { workspace = true }
pmetal-data = { workspace = true }
pmetal-models = { workspace = true }
pmetal-distill = { workspace = true }
pmetal-metal = { workspace = true }
# Writes the ANE trainer's output model next to the base model's side files.
pmetal-merge = { workspace = true, optional = true }
safetensors = { workspace = true, optional = true }
pmetal-distributed = { workspace = true, optional = true }
pmetal-hub = { workspace = true, optional = true }
pmetal-runtime = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indicatif = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }

# TensorBoard event files
prost = { workspace = true }
crc = { workspace = true }

[dev-dependencies]
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
