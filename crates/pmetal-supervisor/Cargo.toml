[package]
name = "pmetal-supervisor"
description = "Runs pmetal subcommands as supervised child processes for the TUI, MCP server and GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["process", "supervisor", "jobs", "subprocess", "pmetal"]
categories = ["concurrency", "os::unix-apis"]

[features]
# `schemars::JsonSchema` on the summary types, for the MCP server's tool schemas.
schemars = ["dep:schemars"]

[dependencies]
pmetal-core = { workspace = true }
anstream = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
rustix = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
