[package]
name = "pmetal-core"
description = "Configuration, job specs, events and shared types for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["ane"]
ane = []

[dependencies]
pmetal-core-derive = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Compile-fail snapshots for `#[derive(JobSpec)]` (tests/ui).
trybuild = { workspace = true }
# Scratch directories that clean up after themselves.
tempfile = { workspace = true }

[lints]
workspace = true
