[package]
name = "pmetal-py"
description = "Python bindings for PMetal — high-performance LLM fine-tuning on Apple Silicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Shipped to PyPI as a wheel (maturin), never as a crate.
publish = false

[lib]
name = "pmetal"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
pmetal-core = { workspace = true }
pmetal-lib = { workspace = true, features = ["hub", "data", "models", "lora", "trainer"] }
pmetal-runtime = { workspace = true }
pmetal-metal = { workspace = true }
pmetal-hub = { workspace = true }
pmetal-models = { workspace = true }
pmetal-data = { workspace = true }
pmetal-trainer = { workspace = true }
pmetal-supervisor = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Hooks that make the extension misbehave on purpose, for the tests that check
# it fails the way it should (a Rust panic must be a Python exception). Never in
# a published wheel.
test-hooks = []

[build-dependencies]
pyo3-build-config = { workspace = true }

[lints]
workspace = true
