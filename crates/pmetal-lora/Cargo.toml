[package]
name = "pmetal-lora"
description = "LoRA, DoRA and QLoRA adapters on any architecture PMetal loads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://epistates.github.io/pmetal/pmetal_lora/"
homepage.workspace = true
readme = "README.md"
keywords = ["lora", "qlora", "fine-tuning", "llm", "apple-silicon"]
categories = ["science", "algorithms"]

[dependencies]
pmetal-core = { workspace = true }
pmetal-runtime = { workspace = true }
pmetal-cache = { workspace = true }
pmetal-models = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
criterion = { workspace = true, features = ["html_reports"] }
tempfile = { workspace = true }
# Pull in pmetal-cache's `test-utils` feature so `base_parity` can reach the
# shared comparison helpers (`ParityReport`, `Tolerance`, …). The feature is
# empty in production builds, so there's no runtime impact.
pmetal-cache = { workspace = true, features = ["test-utils"] }


[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
