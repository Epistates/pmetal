[package]
name = "pmetal-lora"
description = "LoRA and QLoRA implementations for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enable fused Metal kernels for accelerated training on Apple Silicon
metal-fused = ["pmetal-metal"]

[dependencies]
pmetal-core = { workspace = true }
pmetal-gguf = { workspace = true }
pmetal-metal = { workspace = true, optional = true }
pmetal-bridge = { workspace = true }
pmetal-mlx = { workspace = true }
pmetal-models = { workspace = true }
half = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = { workspace = true }
# Pull in pmetal-mlx's `test-utils` feature so `base_parity` can reach the
# shared comparison helpers (`ParityReport`, `Tolerance`, …). The feature is
# empty in production builds, so there's no runtime impact.
pmetal-mlx = { workspace = true, features = ["test-utils"] }


[lints]
workspace = true
