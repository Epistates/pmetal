[package]
name = "pmetal-vocoder"
description = "Neural vocoder (BigVGAN) for text-to-speech synthesis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://epistates.github.io/pmetal/pmetal_vocoder/"
homepage.workspace = true
readme = "README.md"
keywords = ["vocoder", "bigvgan", "text-to-speech", "audio", "apple-silicon"]
categories = ["multimedia::audio", "science"]

[dependencies]
pmetal-runtime = { workspace = true }
pmetal-hub = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }

[dev-dependencies]
# Fail every test at the runtime op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
criterion = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
