[package]
name = "pmetal-data"
description = "Dataset handling and preprocessing for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pmetal-core = { workspace = true }
pmetal-runtime = { workspace = true }
pmetal-gguf = { workspace = true }
serde = { workspace = true }
# `preserve_order`: chat-template inputs (tool schemas, template kwargs) render
# in the order the caller wrote them, as Python dicts do.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
tokenizers = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
# Already in the tree through minijinja-contrib's dates; formats "now" for the
# Llama 3 `strftime_now` shim with real strftime directives.
jiff = { workspace = true }
memmap2 = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
tempfile = { workspace = true }
# Pull in pmetal-mlx's `test-utils` feature so the parity integration tests can
# reach the shared helpers (`test_utils::*`). The feature is empty in production
# builds, so there's no runtime impact.
pmetal-mlx = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
