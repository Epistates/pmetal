[package]
name = "pmetal-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Distributed training and inference backend for PMetal (Home Clusters)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["distributed", "all-reduce", "cluster", "apple-silicon", "mlx"]
categories = ["network-programming", "science"]

[features]
default = []
# MLX distributed C API wrappers (JACCL/Ring/RDMA backends)
mlx-collectives = ["dep:pmetal-runtime"]
# Weight sharding, distributed linear layers
tensor-parallel = ["mlx-collectives"]
# MoE expert dispatch across nodes
expert-parallel = ["mlx-collectives"]
# Ring attention, KV cache sharding
context-parallel = ["mlx-collectives"]
# ZeRO optimizer state/gradient sharding (pure Rust, no MLX dep)
zero = []
# 1F1B and zero-bubble pipeline training schedules (pure Rust)
pipeline-training = []
# DiLoCo low-communication training: one synchronisation per H inner steps
diloco = []
# Enable all distributed capabilities
full = ["mlx-collectives", "tensor-parallel", "expert-parallel", "context-parallel", "zero", "pipeline-training", "diloco"]

[dependencies]
# Use workspace versions for consistency
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bitcode = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async utilities
futures = { workspace = true }
async-trait = { workspace = true }
zerocopy = { workspace = true }

# Peer discovery and networking (libp2p stack)
libp2p = { workspace = true, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "gossipsub",
    "identify",
    "ping",
    "macros",
    "ed25519",
    "serde",
] }

# Topology graph
petgraph = { workspace = true }

# Utilities
dirs = { workspace = true }
sha3 = { workspace = true }
# Authenticated, encrypted links (Noise) and the secret that keys them.
snow = { workspace = true, features = ["ring-accelerated"] }
secrecy = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
# Seals and opens a batch of frames on several cores.
rayon = { workspace = true }
half = { workspace = true }
ordered-float = { workspace = true }

# Local NIC enumeration for fabric detection (Thunderbolt / Ethernet / WiFi).
if-addrs = { workspace = true }

# MLX runtime (optional — gated behind mlx-collectives feature)
pmetal-runtime = { workspace = true, optional = true }

[dev-dependencies]
# Fail every test at the runtime op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
