[package]
name = "pmetal-cache"
description = "KV caches, prefix reuse and speculative-decoding state for PMetal's decoder models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["kv-cache", "llm", "inference", "speculative-decoding", "apple-silicon"]
categories = ["science", "caching"]

[dependencies]
pmetal-runtime = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Fail every test at the runtime op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }

[features]
# Enables `pmetal_cache::test_utils` for cross-crate parity tests. Empty
# (no extra deps) — production builds never see it. Integration tests in
# downstream crates that need shared parity helpers add this feature in
# their own `[dev-dependencies]`.
test-utils = []

[lints]
workspace = true
