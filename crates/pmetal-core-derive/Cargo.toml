[package]
name = "pmetal-core-derive"
description = "Procedural macros for pmetal-core (JobSpec derive)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://epistates.github.io/pmetal/pmetal_core_derive/"
homepage.workspace = true
readme = "README.md"
keywords = ["derive", "proc-macro", "job-spec", "cli", "pmetal"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
