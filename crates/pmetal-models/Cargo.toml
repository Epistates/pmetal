[package]
name = "pmetal-models"
description = "LLM architectures, checkpoint loading and generation for PMetal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
pmetal-runtime = { workspace = true }
pmetal-core = { workspace = true }
pmetal-data = { workspace = true }
pmetal-gguf = { workspace = true }
pmetal-hub = { workspace = true }
pmetal-metal = { workspace = true }
pmetal-cache = { workspace = true }
serde = { workspace = true }
# `preserve_order`: a decision request's questions are encoded, and answered, in
# the order the client wrote them. `float_roundtrip`: a float in a request is
# re-rendered into the prompt, and the default parser can land one ulp off, which
# then prints as different digits (see `decision::encode`).
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror = { workspace = true }
tracing = { workspace = true }
safetensors = { workspace = true }
json5 = { workspace = true }

# Metal dependencies (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-metal = { workspace = true }

[dev-dependencies]
# PyTorch checkpoint builders for the loader's tests.
pmetal-hub = { workspace = true, features = ["testing"] }
# Fail every test at the bridge op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
serial_test = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
# Pull in pmetal-cache's `test-utils` feature so integration tests can reach
# the shared parity helpers (`test_utils::*`). The feature is empty in
# production builds, so there's no runtime impact.
pmetal-cache = { workspace = true, features = ["test-utils"] }

[features]
default = ["ane"]
ane = ["pmetal-metal/ane", "pmetal-core/ane"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
