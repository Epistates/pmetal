[package]
name = "pmetal-merge"
description = "Model merging toolkit for PMetal - SLERP, TIES, DARE, and more"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []

[dependencies]
pmetal-runtime = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
pmetal-hub = { workspace = true }
half = { workspace = true }
zerocopy = { workspace = true }
memmap2 = { workspace = true }
ndarray = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# Fail every test at the runtime op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
tempfile = { workspace = true }
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "merge_benchmarks"
harness = false

[lints]
workspace = true
