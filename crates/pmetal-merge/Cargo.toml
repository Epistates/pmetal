[package]
name = "pmetal-merge"
description = "Model merging for PMetal: SLERP, TIES, DARE, DELLA and more, streamed tensor by tensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://epistates.github.io/pmetal/pmetal_merge/"
homepage.workspace = true
readme = "README.md"
keywords = ["model-merging", "llm", "slerp", "ties", "apple-silicon"]
categories = ["science", "algorithms"]

[features]
default = []

[dependencies]
pmetal-runtime = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
pmetal-hub = { workspace = true }
half = { workspace = true }
memmap2 = { workspace = true }
ndarray = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# Fail every test at the runtime op that throws (pmetal-runtime `strict-errors`).
pmetal-runtime = { workspace = true, features = ["strict-errors"] }
tempfile = { workspace = true }
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "merge_benchmarks"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
# Apple Silicon only: document the platform the crate runs on.
targets = ["aarch64-apple-darwin"]
