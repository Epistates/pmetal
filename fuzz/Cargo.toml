[package]
name = "anteater-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, like crates/pmetal-gui/src-tauri: see the comment
# there for why the root manifest's `exclude` alone is not enough.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pmetal-gguf = { path = "../crates/pmetal-gguf" }

[target.'cfg(fuzzing)'.dependencies]
arbitrary = { version = "1.5", features = ["derive"] }

[[bin]]
name = "gguf_reader"
path = "fuzz_targets/gguf_reader.rs"
test = false
doc = false

[[bin]]
name = "gguf_dequant"
path = "fuzz_targets/gguf_dequant.rs"
test = false
doc = false
