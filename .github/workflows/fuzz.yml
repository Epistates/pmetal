name: Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Run daily

# A new push to a pull request cancels its older run; every other run has a group of its own, since a shared one would cancel the pending ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


    # The pinned toolchain runs `cargo install` below (`cargo +nightly` runs the
    # fuzzer). rustup's own auto-install of it is deprecated, and when a runner
    # already has an empty directory for the toolchain it installs only the file's
    # components: no cargo, no rustc. `component add` fills that in and changes
    # nothing on a complete install.
    # Drop `component add` once rustup stops counting a toolchain directory
    # with no manifest as installed (https://github.com/rust-lang/goals/issues/736).
    - name: Install the pinned Rust toolchain
      run: |
        rustup toolchain install --no-self-update
        rustup component add cargo rustc

    - name: Install nightly Rust
      uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      with:
        toolchain: nightly

    - name: Install cargo-fuzz
      # A pinned release with its own lockfile, not whatever is newest today.
      run: cargo install --locked cargo-fuzz@0.13.2

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Fuzz GGUF Reader
      run: cargo +nightly fuzz run gguf_reader -- -max_total_time=300
