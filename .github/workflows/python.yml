name: Python Bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a-dtolnay-then-cargo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo --version
      - run: ls ~/.rustup/toolchains/1.99.1-aarch64-apple-darwin/bin
  b-cargo-first:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo --version
      - run: ls ~/.rustup/toolchains/1.99.1-aarch64-apple-darwin/bin
  c-explicit-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --no-self-update
      - run: cargo --version
      - run: ls ~/.rustup/toolchains/1.99.1-aarch64-apple-darwin/bin
  d-dtolnay-install-action-then-cargo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - run: cargo --version
      - run: ls ~/.rustup/toolchains/1.99.1-aarch64-apple-darwin/bin
