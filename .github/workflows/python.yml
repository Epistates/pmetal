name: Python Bindings

# Builds the wheel the way a release ships it and runs the test suite against
# the installed wheel (not an editable install).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

# A new push to a pull request cancels its older run; every other run has a group of its own, since a shared one would cancel the pending ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Install nothing from PyPI that is younger than a week: most malicious
  # releases are caught and pulled within days. pip reads a duration here from
  # 26.1, which each job installs first with this unset.
  PIP_UPLOADED_PRIOR_TO: P7D
  # Persistent MLX prefix, as in ci.yml: build.rs reuses a matching pre-built
  # MLX here and skips cmake, and a fresh build is copied back in.
  PMETAL_MLX_PREFIX: ${{ github.workspace }}/.mlx-cache

jobs:
  # The abi3 wheel is built once, on the oldest Python it supports, and tested
  # on the oldest and the newest (`test`).
  wheel:
    name: Wheel (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler for everything under the
      # checkout, so that is the toolchain to install; a `stable` would never
      # be used. rustup's own auto-install of it is deprecated, and when a
      # runner already has an empty directory for the toolchain it installs
      # only the file's components: no cargo, no rustc. `component add` fills
      # that in and changes nothing on a complete install.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add cargo rustc

      # The MLX revision (tag or commit) comes from build.rs, so the key
      # tracks it, and the files that drive MLX's cmake configure. The key is
      # apart from ci.yml's: the wheel links MLX statically, a different
      # build, in its own slot of the prefix.
      - name: Resolve the MLX cache key
        id: mlx
        env:
          MLX_SOURCES: ${{ hashFiles('crates/pmetal-runtime/build.rs', 'crates/pmetal-runtime/cmake/**', 'crates/pmetal-runtime/patches/**') }}
        run: |
          tag=$(grep -E '^const BUNDLED_MLX_GIT_TAG' \
            crates/pmetal-runtime/build.rs | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Resolved MLX tag: $tag"
          prefix="mlx-static-$RUNNER_OS-$RUNNER_ARCH-$tag-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$MLX_SOURCES" >> "$GITHUB_OUTPUT"

      - name: Restore MLX
        id: mlx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PMETAL_MLX_PREFIX }}
          key: ${{ steps.mlx.outputs.key }}
          restore-keys: ${{ steps.mlx.outputs.prefix }}

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: env -u PIP_UPLOADED_PRIOR_TO python -m pip install --upgrade "pip>=26.1"

      - name: Install maturin
        run: pip install "maturin>=1.15,<2.0"

      # MLX linked statically, the `pmetal` command line and the metallib built
      # with that MLX inside the package, and the unwinding `wheel` profile
      # (see `just build-wheel`).
      - name: Build the wheel
        run: just build-wheel

      # Saved right after the build, so a failing test does not throw it away.
      - name: Save MLX
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PMETAL_MLX_PREFIX }}
          key: ${{ steps.mlx.outputs.key }}

      - name: Check the wheel carries the metallib and the command line
        run: |
          set -euo pipefail
          ls target/wheels
          unzip -l target/wheels/*.whl | grep -q 'pmetal/mlx.metallib$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/_bin/pmetal$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/py.typed$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/pmetal.pyi$'

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmetal-wheel-macos-aarch64
          path: target/wheels/*.whl

  test:
    name: Tests (macOS aarch64, Python ${{ matrix.python }})
    needs: wheel
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: env -u PIP_UPLOADED_PRIOR_TO python -m pip install --upgrade "pip>=26.1"

      - name: Fetch the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pmetal-wheel-macos-aarch64
          path: target/wheels

      - name: Install the wheel and the test tools
        run: |
          pip install target/wheels/*.whl
          pip install pytest mypy pyright ruff

      # The package is imported from the installed wheel: the checkout keeps its
      # sources in py_src, which is not on the import path.
      - name: Lint
        working-directory: crates/pmetal-py
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        working-directory: crates/pmetal-py
        run: python -m pytest tests -v

  # A free-threaded CPython cannot load an abi3 wheel (that needs Python 3.15's
  # abi3t), so 3.14t gets a wheel of its own, built for its interpreter (maturin
  # builds one for a named interpreter that cannot use the stable ABI, and the
  # abi3 wheel when none is named) and tested with the GIL off.
  wheel-free-threaded:
    name: Wheel and tests (macOS aarch64, Python 3.14t)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See the `wheel` job for this and the MLX cache: the MLX is the same
      # one, it does not depend on the Python.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add cargo rustc

      - name: Resolve the MLX cache key
        id: mlx
        env:
          MLX_SOURCES: ${{ hashFiles('crates/pmetal-runtime/build.rs', 'crates/pmetal-runtime/cmake/**', 'crates/pmetal-runtime/patches/**') }}
        run: |
          tag=$(grep -E '^const BUNDLED_MLX_GIT_TAG' \
            crates/pmetal-runtime/build.rs | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Resolved MLX tag: $tag"
          prefix="mlx-static-$RUNNER_OS-$RUNNER_ARCH-$tag-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$MLX_SOURCES" >> "$GITHUB_OUTPUT"

      - name: Restore MLX
        id: mlx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PMETAL_MLX_PREFIX }}
          key: ${{ steps.mlx.outputs.key }}
          restore-keys: ${{ steps.mlx.outputs.prefix }}

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"

      - name: Upgrade pip
        run: env -u PIP_UPLOADED_PRIOR_TO python -m pip install --upgrade "pip>=26.1"

      - name: Install maturin
        run: pip install "maturin>=1.15,<2.0"

      - name: Build the wheel
        run: just build-wheel python

      - name: Save MLX
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PMETAL_MLX_PREFIX }}
          key: ${{ steps.mlx.outputs.key }}

      - name: Check it is the free-threaded wheel
        run: ls target/wheels/*-cp314-cp314t-macosx_14_0_arm64.whl

      - name: Install the wheel and the test tools
        run: |
          pip install target/wheels/*.whl
          pip install pytest mypy pyright

      # PYTHON_GIL=0, so a module that does not declare itself safe cannot
      # quietly turn the GIL back on for the run.
      - name: Test without the GIL
        working-directory: crates/pmetal-py
        env:
          PYTHON_GIL: "0"
        run: python -m pytest tests -v
