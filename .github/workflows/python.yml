name: Python Bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a-empty-dir-then-autoinstall:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p ~/.rustup/toolchains/1.99.1-aarch64-apple-darwin
      - run: cargo --version || true
  b-empty-dir-then-explicit-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p ~/.rustup/toolchains/1.99.1-aarch64-apple-darwin
      - run: rustup toolchain install --no-self-update
      - run: cargo --version && cargo clippy --version && cargo fmt --version
  c-no-file-components:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo --version
