name: Python Bindings

# Builds the wheel the way a release ships it and runs the test suite against
# the installed wheel (not an editable install). Manual until the bindings are
# published.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Install nothing from PyPI that is younger than a week: most malicious
  # releases are caught and pulled within days. pip reads a duration here from
  # 26.1, which each job installs first with this unset.
  PIP_UPLOADED_PRIOR_TO: P7D

jobs:
  wheel:
    name: Wheel and tests (macOS aarch64, Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The abi3 wheel is built once, on the oldest Python it supports, and
        # tested on the oldest and the newest.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: env -u PIP_UPLOADED_PRIOR_TO python -m pip install --upgrade "pip>=26.1"

      - name: Install maturin
        run: pip install "maturin>=1.15,<2.0"

      # MLX linked statically, the `pmetal` command line and the metallib built
      # with that MLX inside the package, and the unwinding `wheel` profile
      # (see `just build-wheel`).
      - name: Build the wheel
        if: matrix.python == '3.11'
        run: just build-wheel

      - name: Check the wheel carries the metallib and the command line
        if: matrix.python == '3.11'
        run: |
          set -euo pipefail
          ls target/wheels
          unzip -l target/wheels/*.whl | grep -q 'pmetal/mlx.metallib$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/_bin/pmetal$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/py.typed$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/pmetal.pyi$'

      - name: Upload the wheel
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmetal-wheel-macos-aarch64
          path: target/wheels/*.whl

      - name: Fetch the wheel built on 3.11
        if: matrix.python != '3.11'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pmetal-wheel-macos-aarch64
          path: target/wheels

      - name: Install the wheel and the test tools
        run: |
          pip install target/wheels/*.whl
          pip install pytest mypy pyright ruff

      # The package is imported from the installed wheel: the checkout keeps its
      # sources in py_src, which is not on the import path.
      - name: Lint
        working-directory: crates/pmetal-py
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        working-directory: crates/pmetal-py
        run: python -m pytest tests -v

  # A free-threaded CPython cannot load an abi3 wheel (that needs Python 3.15's
  # abi3t), so 3.14t gets a wheel of its own, built from its interpreter and
  # tested with the GIL off.
  wheel-free-threaded:
    name: Wheel and tests (macOS aarch64, Python 3.14t)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"

      - name: Upgrade pip
        run: env -u PIP_UPLOADED_PRIOR_TO python -m pip install --upgrade "pip>=26.1"

      - name: Install maturin
        run: pip install "maturin>=1.15,<2.0"

      - name: Build the wheel
        run: just build-wheel

      - name: Check it is the free-threaded wheel
        run: ls target/wheels | grep -q 'cp314-cp314t-macosx_14_0_arm64.whl$'

      - name: Install the wheel and the test tools
        run: |
          pip install target/wheels/*.whl
          pip install pytest mypy pyright

      # PYTHON_GIL=0, so a module that does not declare itself safe cannot
      # quietly turn the GIL back on for the run.
      - name: Test without the GIL
        working-directory: crates/pmetal-py
        env:
          PYTHON_GIL: "0"
        run: python -m pytest tests -v
