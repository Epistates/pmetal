name: Python Bindings

# Builds the wheel the way a release ships it and runs the test suite against
# the installed wheel (not an editable install). Manual until the bindings are
# published.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wheel:
    name: Wheel and tests (macOS aarch64, Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The abi3 wheel is built once, on the oldest Python it supports, and
        # tested on the oldest and the newest.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install maturin
        run: pip install "maturin>=1.15,<2.0"

      # MLX linked statically, the `pmetal` command line and the metallib built
      # with that MLX inside the package, and the unwinding `wheel` profile
      # (see `just build-wheel`).
      - name: Build the wheel
        if: matrix.python == '3.11'
        run: just build-wheel

      - name: Check the wheel carries the metallib and the command line
        if: matrix.python == '3.11'
        run: |
          set -euo pipefail
          ls target/wheels
          unzip -l target/wheels/*.whl | grep -q 'pmetal/mlx.metallib$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/_bin/pmetal$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/py.typed$'
          unzip -l target/wheels/*.whl | grep -q 'pmetal/pmetal.pyi$'

      - name: Upload the wheel
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: pmetal-wheel-macos-aarch64
          path: target/wheels/*.whl

      - name: Fetch the wheel built on 3.11
        if: matrix.python != '3.11'
        uses: actions/download-artifact@v7
        with:
          name: pmetal-wheel-macos-aarch64
          path: target/wheels

      - name: Install the wheel and the test tools
        run: |
          pip install target/wheels/*.whl
          pip install pytest mypy pyright ruff

      # The package is imported from the installed wheel: the checkout keeps its
      # sources in py_src, which is not on the import path.
      - name: Lint
        working-directory: crates/pmetal-py
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        working-directory: crates/pmetal-py
        run: python -m pytest tests -v
