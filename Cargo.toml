[workspace]
resolver = "2"
exclude = ["fuzz", "crates/pmetal-gui/src-tauri"]
members = [
    "crates/pmetal-bridge",
    "crates/pmetal-core",
    "crates/pmetal-core-derive",
    "crates/pmetal-metal",
    "crates/pmetal-mlx",
    "crates/pmetal-models",
    "crates/pmetal-lora",
    "crates/pmetal-data",
    "crates/pmetal-trainer",
    "crates/pmetal-hub",
    "crates/pmetal-gguf",
    "crates/pmetal-vocoder",
    "crates/pmetal-merge",
    "crates/pmetal-distill",
    "crates/pmetal-distributed",
    "crates/pmetal-mhc",
    "crates/pmetal-serve",
    "crates/pmetal-mcp",
    "crates/pmetal",
    "crates/pmetal-py",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/epistates/pmetal"
keywords = ["machine-learning", "llm", "fine-tuning", "apple-silicon", "mlx"]
categories = ["science", "algorithms"]

[workspace.dependencies]
# Internal crates
pmetal-bridge = { path = "crates/pmetal-bridge", version = "0.6.0" }
pmetal-core = { path = "crates/pmetal-core", version = "0.6.0", default-features = false }
pmetal-core-derive = { path = "crates/pmetal-core-derive", version = "0.6.0" }
pmetal-metal = { path = "crates/pmetal-metal", version = "0.6.0", default-features = false }
pmetal-mlx = { path = "crates/pmetal-mlx", version = "0.6.0" }
pmetal-models = { path = "crates/pmetal-models", version = "0.6.0" }
pmetal-lora = { path = "crates/pmetal-lora", version = "0.6.0" }
pmetal-data = { path = "crates/pmetal-data", version = "0.6.0" }
pmetal-trainer = { path = "crates/pmetal-trainer", version = "0.6.0" }
pmetal-hub = { path = "crates/pmetal-hub", version = "0.6.0" }
pmetal-gguf = { path = "crates/pmetal-gguf", version = "0.6.0" }
pmetal-vocoder = { path = "crates/pmetal-vocoder", version = "0.6.0" }
pmetal-merge = { path = "crates/pmetal-merge", version = "0.6.0" }
pmetal-distill = { path = "crates/pmetal-distill", version = "0.6.0" }
pmetal-mhc = { path = "crates/pmetal-mhc", version = "0.6.0" }
pmetal-distributed = { path = "crates/pmetal-distributed", version = "0.6.0" }
pmetal-serve = { path = "crates/pmetal-serve", version = "0.6.0" }
pmetal-mcp = { path = "crates/pmetal-mcp", version = "0.6.0" }
# The CLI crate, as a library. Renamed because pmetal-py's own lib is `pmetal`.
pmetal-lib = { package = "pmetal", path = "crates/pmetal", version = "0.6.0", default-features = false }

# Every external dependency of every member is declared here, once, and
# members take it with `dep = { workspace = true }` (adding features locally
# where they need them). `just check-workspace-deps` fails on a member that
# names a version itself, and on a GUI or fuzz requirement that differs from
# the one here: those are separate workspaces and can't inherit, so they
# repeat these strings verbatim.

# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3.34"
async-trait = "0.1"

# HTTP server (pmetal-serve)
axum = "0.8"
tower-http = "0.7"

# MCP server (pmetal-mcp)
turbomcp = "3.6.0"

# Peer discovery and networking (pmetal-distributed)
libp2p = "0.57"
petgraph = "0.8"
if-addrs = "0.15"
sha3 = "0.12"

# Terminal dashboard
ratatui = "0.30"
crossterm = "0.29"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.3"
json5 = "1.3.1"
# TensorBoard event files
prost = "0.14"
crc = "3.4"

# Error handling
thiserror = "2"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Data formats
safetensors = "0.8"
arrow = "60"
parquet = "60"
arrow-array = "60"
arrow-json = "60"

# HuggingFace integration
hf-hub = "1.0"
tokenizers = "0.23"
reqwest = { version = "0.13", features = ["json", "multipart", "stream", "rustls"] }
sha2 = "0.11"
base64 = "0.23"
secrecy = "0.10"

# Jinja template engine for executing upstream chat_template strings from
# tokenizer_config.json. `minijinja-contrib` adds the `now()` and date
# filters; `strftime_now`, which Llama 3 chat templates use for dynamic date
# injection, is ours, on `jiff` (what minijinja-contrib's dates use too).
# `preserve_order` keeps maps in insertion order and `loop_controls` enables
# `{% break %}` / `{% continue %}`: Python dicts and the loopcontrols extension
# that Hugging Face transformers renders chat templates with. `serde` converts
# the messages, tools and template kwargs into template values.
minijinja = { version = "3", features = ["builtins", "macros", "preserve_order", "loop_controls", "serde"] }
minijinja-contrib = { version = "3", features = ["datetime", "pycompat"] }
jiff = "0.2.38"

# Serialization (binary)
bitcode = { version = "0.6", features = ["serde"] }

# Metal bindings (modern objc2 ecosystem)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSProcessInfo", "NSString"] }
objc2-metal = { version = "0.3", features = [
    "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder",
    "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLLibrary",
    "MTLBuffer", "MTLResource", "MTLEvent", "MTLFence",
    # Metal 4 / MPP infrastructure (Tasks 7-9)
    "MTL4CommandAllocator", "MTL4CommandBuffer", "MTL4CommandQueue",
    "MTL4CommandEncoder", "MTL4ComputeCommandEncoder",
    "MTLResidencySet", "MTLAllocation",
] }
dispatch2 = "0.3"

# Utilities
zerocopy = { version = "0.8", features = ["derive"] }
half = { version = "2", features = ["zerocopy"] }
ndarray = { version = "0.17", features = ["rayon"] }
rayon = "1"
# Floors at or past RUSTSEC-2026-0097 (rand) and RUSTSEC-2026-0186 (memmap2),
# so a library consumer can't resolve below them.
rand = "0.10.3"
rand_distr = "0.6"
ordered-float = "5"
byteorder = "1.5"
indicatif = "0.18"
dirs = "7"
walkdir = "2"
memmap2 = "0.9.11"
chrono = "0.4.45"
# Every decoder `image` has, without its default `avif` feature: that one is an
# AVIF *encoder* (rav1e and its dependency tree), and nothing here writes AVIF.
image = { version = "0.25.10", default-features = false, features = [
    "rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
flate2 = "1"
libc = "0.2.190"
parking_lot = "0.12.5"
regex = "1.13"
uuid = "1.27"

# Proc-macro authoring (pmetal-core-derive)
proc-macro2 = "1.0"
quote = "1.0"
syn = "3.0"

# Native build helpers
cc = "1.6"
cmake = "0.1"

# Python bindings
pyo3 = "0.29"
pyo3-build-config = "0.29"

# Testing
criterion = "0.8"
tempfile = "3"
proptest = "1.11"
serial_test = "4.0"
approx = "0.5"
trybuild = "1.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Build scripts / proc macros don't need fat LTO or single codegen unit
[profile.release.build-override]
opt-level = 2
codegen-units = 16

# CI: release-quality but faster compilation (thin LTO, parallel codegen)
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = false

[profile.dev]
opt-level = 1
# File and line in backtraces and profiler stacks, without full DWARF for every
# crate: with the default, debug info (and the per-codegen-unit .o files macOS
# keeps for it) was a large share of target/. For variables in lldb, build with
# CARGO_PROFILE_DEV_DEBUG=true. crates/pmetal-gui/src-tauri mirrors this
# profile so the two workspaces share builds in target/.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Build scripts / proc macros compile faster at opt-level 0
[profile.dev.build-override]
opt-level = 0

# Benchmarks: release perf with debug symbols for Instruments profiling
[profile.bench]
debug = 1
